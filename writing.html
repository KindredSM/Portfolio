<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Writing by Kindred Salway" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <title>Writing - Kindred Salway</title>
    <style>
      .posts {
        margin-top: 10px;
      }
      .post {
        display: block;
        padding: 22px 0;
        border-bottom: 1px solid var(--rule);
        text-decoration: none;
        color: inherit;
        transition: color 0.2s ease, padding-left 0.2s ease;
      }
      .post:last-child {
        border-bottom: none;
      }
      .post:hover {
        color: var(--cyan);
        padding-left: 10px;
      }
      .post-date {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .post-title {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        color: var(--ink);
      }
      .post-excerpt {
        max-width: 640px;
        font-size: 15px;
        color: var(--soft-ink);
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html" class="back-link">&larr; Back</a>

      <header class="hero" style="margin-bottom: 48px;">
        <h1>Writing</h1>
        <p class="tagline">Notes on building, thinking, and life.</p>
      </header>

      <div class="posts">
        <a href="thinking.html" class="post">
          <div class="post-date">June 2025</div>
          <div class="post-title">Directing potency in the face of optionality</div>
          <div class="post-excerpt">
            If you feel lost, write. Most people mistake noise in their head for thought.
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
